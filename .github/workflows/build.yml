name: Build Glitch Sys

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-cli:
    name: Linux CLI (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip pyinstaller rich
      - run: |
          cd src
          pyinstaller --onefile --name glitch_linux_x86_64 \
            --exclude-module kivy \
            --exclude-module tkinter \
            glitch_sys.py
      - uses: actions/upload-artifact@v4
        with:
          name: glitch_linux_x86_64
          path: src/dist/glitch_linux_x86_64

  build-linux-gui:
    name: Linux GUI (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 libportmidi0 libgl1-mesa-dev
      - run: pip install --upgrade pip pyinstaller rich kivy
      - run: |
          cd src
          pyinstaller --onefile --name glitch_linux_x86_64_gui \
            --collect-all kivy \
            glitch_sys.py
      - uses: actions/upload-artifact@v4
        with:
          name: glitch_linux_x86_64_gui
          path: src/dist/glitch_linux_x86_64_gui

  release:
    name: Release
    needs: [build-linux-cli, build-linux-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
