name: Build Glitch Sys

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller rich
      - run: |
          cd src
          pyinstaller --onefile --name glitch_linux_${{ matrix.arch }} glitch_sys.py
      - uses: actions/upload-artifact@v4
        with:
          name: glitch_linux_${{ matrix.arch }}
          path: src/dist/glitch_linux_${{ matrix.arch }}

  release:
    name: Release
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
